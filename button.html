<!-- Copy-article-link button: canonical URL, clean UTMs, GA4 share event, fallback copy -->
<style>
  .share-btn-container {
    /* Theme tokens: override these to match the site */
    --share-fg: #1d2939;
    --share-muted: #475467;
    --share-bg: #ffffff;
    --share-bg-hover: #f2f4f7;
    --share-border: #d0d5dd;
    --share-ring: rgba(46, 144, 250, 0.35);
    --share-success-fg: #067647;
    --share-success-bg: #ecfdf3;
    --share-success-border: #abefc6;
    --share-error-fg: #b42318;
    --share-error-bg: #fef3f2;
    --share-error-border: #fecdca;

    display: flex;
    justify-content: center;
    align-items: center;
    margin: 16px 0;
  }

  .share-btn-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 168px;
    height: 40px;
    padding: 0 18px;
    border: 1px solid var(--share-border);
    border-radius: 999px;
    background: var(--share-bg);
    color: var(--share-fg);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
    transition:
      background-color 0.15s ease,
      border-color 0.15s ease,
      color 0.15s ease,
      box-shadow 0.15s ease,
      transform 0.1s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .share-btn-link:hover {
    background: var(--share-bg-hover);
    box-shadow: 0 1px 3px rgba(16, 24, 40, 0.1);
  }

  .share-btn-link:active { transform: scale(0.97); }

  .share-btn-link:focus-visible {
    outline: none;
    box-shadow: 0 0 0 4px var(--share-ring);
  }

  .share-btn-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: var(--share-muted);
    transition: color 0.15s ease;
  }

  .share-btn-icon--check,
  .share-btn-icon--error { display: none; }

  /* Success */
  .share-btn-link.is-success {
    background: var(--share-success-bg);
    border-color: var(--share-success-border);
    color: var(--share-success-fg);
  }
  .share-btn-link.is-success .share-btn-icon { color: var(--share-success-fg); }
  .share-btn-link.is-success .share-btn-icon--link { display: none; }
  .share-btn-link.is-success .share-btn-icon--check {
    display: block;
    animation: share-pop 0.25s ease;
  }

  /* Error */
  .share-btn-link.is-error {
    background: var(--share-error-bg);
    border-color: var(--share-error-border);
    color: var(--share-error-fg);
  }
  .share-btn-link.is-error .share-btn-icon { color: var(--share-error-fg); }
  .share-btn-link.is-error .share-btn-icon--link { display: none; }
  .share-btn-link.is-error .share-btn-icon--error { display: block; }

  @keyframes share-pop {
    0% { transform: scale(0.6); opacity: 0; }
    70% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .share-btn-link,
    .share-btn-icon { transition: none; }
    .share-btn-link:active { transform: none; }
    .share-btn-link.is-success .share-btn-icon--check { animation: none; }
  }

  .share-btn-status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>

<div class="share-btn-container">
  <button class="share-btn-link js-share-article" type="button">
    <svg class="share-btn-icon share-btn-icon--link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    </svg>
    <svg class="share-btn-icon share-btn-icon--check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <svg class="share-btn-icon share-btn-icon--error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span class="share-btn-label">Copy article link</span>
  </button>
  <span class="share-btn-status" role="status" aria-live="polite"></span>
</div>

<script>
(function () {
  // Lowercase, consistent values. GA4 is case-sensitive.
  var UTM = {
    utm_source: 'copy_link',
    utm_medium: 'share',
    utm_campaign: 'article_share'
  };

  // Params that should never ride along on a shared link
  var STRIP = /^(utm_.*|fbclid|gclid|gbraid|wbraid|msclkid|mc_cid|mc_eid|_ga|_gl)$/i;

  function buildShareUrl() {
    var canonical = document.querySelector('link[rel="canonical"]');
    var base = canonical && canonical.href ? canonical.href : window.location.href;
    var url = new URL(base);
    url.hash = '';
    Array.from(url.searchParams.keys()).forEach(function (key) {
      if (STRIP.test(key)) url.searchParams.delete(key);
    });
    Object.keys(UTM).forEach(function (key) {
      url.searchParams.set(key, UTM[key]);
    });
    return url.toString();
  }

  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (e) { /* fall through to legacy copy */ }
    }
    return legacyCopy(text);
  }

  // GA4 recommended "share" event, sent through Site Kit's gtag
  function track(ok) {
    if (typeof window.gtag !== 'function') return; // blocked, or GA not loaded
    window.gtag('event', 'share', {
      method: 'copy_link',
      content_type: 'article',
      item_id: window.location.pathname,
      share_status: ok ? 'success' : 'error'
    });
  }

  function wire(btn) {
    if (btn.dataset.shareWired) return; // safe if the snippet appears twice
    btn.dataset.shareWired = '1';

    var labelEl = btn.querySelector('.share-btn-label') || btn;
    var label = labelEl.textContent;      // captured once, not per click
    var status = btn.parentNode.querySelector('.share-btn-status');
    var timer;

    btn.addEventListener('click', async function () {
      var shareUrl = buildShareUrl();
      var ok = await copyText(shareUrl);
      track(ok);

      clearTimeout(timer);
      btn.classList.remove('is-success', 'is-error');
      void btn.offsetWidth; // restart the check animation on repeat clicks
      btn.classList.add(ok ? 'is-success' : 'is-error');
      labelEl.textContent = ok ? 'Link copied' : 'Copy failed';
      if (status) status.textContent = ok ? 'Article link copied to clipboard' : 'Could not copy link';

      if (!ok) window.prompt('Copy this link:', shareUrl);

      timer = setTimeout(function () {
        labelEl.textContent = label;
        btn.classList.remove('is-success', 'is-error');
        if (status) status.textContent = '';
      }, 2000);
    });
  }

  function init() {
    document.querySelectorAll('.js-share-article').forEach(wire);
  }

  // Works whether the script runs before or after DOMContentLoaded
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
